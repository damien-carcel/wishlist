version: 2.1

commands:
  set_host_user_ids_environment_variable:
    description: "Set Docker Compose HOST_USER_IDS environment variable according to the host virtual machine"
    steps:
      - run:
          name: Set Docker Compose HOST_USER_IDS environment variable according to the host virtual machine
          command: |
            set -e
            MACHINE_IDS=$(id -u):$(id -g)
            echo "export HOST_USER_IDS='${MACHINE_IDS}'" >> $BASH_ENV
  install_task:
    description: "Install the latest Task binary"
    steps:
      - run:
          name: Install the latest Task binary
          command: npm install -g @go-task/cli
executors:
  ubuntu:
    machine:
      image: ubuntu-2604:current

jobs:
  tests:
    executor: ubuntu
    steps:
      - checkout
      - set_host_user_ids_environment_variable
      - install_task
      - run:
          name: Setup Composer cache and config directories
          command: mkdir -p ~/.cache/composer ~/.config/composer
      - restore_cache:
          keys:
            - composer-{{ .Environment.CACHE_VERSION }}-{{ checksum "composer.lock" }}
            - composer-{{ .Environment.CACHE_VERSION }}-
      - run:
          name: Install dependencies
          command: task dependencies:install
      - save_cache:
          key: composer-{{ .Environment.CACHE_VERSION }}-{{ checksum "composer.lock" }}
          paths:
            - ./vendor
      - run:
          name: Create the test results directory
          command: mkdir -p test_results
      - run:
          name: Check the code-style
          command: task tests:code-style:check -- --format=junit > test_results/cs.xml
      - run:
          name: Run the static-analysis
          command: task tests:static-analysis -- --error-format=junit > test_results/sa.xml
      - run:
          name: Run the unit tests
          command: task tests:unit -- --log-junit test_results/unit.xml
      - run:
          name: Run the acceptance tests
          command: task tests:acceptance -- --log-junit test_results/acceptance.xml
      - run:
          name: Run the integration tests with "in memory" adapters
          command: task tests:integration-with-in-memory-adapters -- --log-junit test_results/integration-with-in-memory-adapters.xml
      - run:
          name: Set up the database for integration tests and end-to-end tests
          command: |
            task database:up
            task database:test:create
      - run:
          name: Run the integration tests with "production" adapters
          command: task tests:integration-with-production-adapters -- --log-junit test_results/integration-with-production-adapters.xml
      - run:
          name: Run the end-to-end tests
          command: task tests:end-to-end -- --log-junit test_results/e2e.xml
      - store_artifacts:
          path: test_results
      - store_test_results:
          path: test_results

  build_and_push:
    executor: ubuntu
    steps:
      - checkout
      - install_task
      - run:
          name: Create production Docker image tag
          command: |
            set -e
            CURRENT_DATE=$(date -u +%Y%m%d%H%M%S)
            echo "export PRODUCTION_IMAGE_TAG='${CURRENT_DATE}'" >> $BASH_ENV
      - run:
          name: Build production Docker image
          command: task build:prod
      - run:
          name: Push production Docker image
          command: |
            echo "$DOCKER_HUB_TOKEN" | docker login -u carcel --password-stdin
            docker push carcel/wishlist:$PRODUCTION_IMAGE_TAG

workflows:
  pull_request:
    jobs:
      - tests:
          filters:
            branches:
              ignore:
                - main
  build_and_push:
    jobs:
      - build_and_push:
          filters:
            branches:
              only: main
