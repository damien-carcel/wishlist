version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  playwright:
    docker:
      - image: mcr.microsoft.com/playwright:v1.65.1-resolute

jobs:
  setup:
    executor:
      name: node/default
      tag: '26'
    steps:
      - checkout
      - run:
          name: Install the latest Task binary
          command: sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/bin
      - restore_cache:
          keys:
            - pnpm-{{ .Environment.CACHE_VERSION }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-{{ .Environment.CACHE_VERSION }}-
      - run:
          name: Install dependencies
          command: task dependencies:install
      - save_cache:
          key: pnpm-{{ .Environment.CACHE_VERSION }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ./node_modules
            - ./.next/cache
      - persist_to_workspace:
          root: ~/
          paths:
            - bin
            - project

  static-analysis:
    executor:
      name: node/default
      tag: '26'
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Check the code style
          command: task tests:static:format
      - run:
          name: Lint the application code
          command: task tests:static:lint -- --format junit -o test_results/eslint.xml
      - run:
          name: Check the code typing
          command: task tests:static:types
      - store_artifacts:
          path: test_results
      - store_test_results:
          path: test_results

  tests:
    executor:
      name: node/default
      tag: '26'
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Run unit tests
          command: task tests:unit -- --reporter=default --reporter=junit --outputFile=./test_results/unit.xml
      - store_artifacts:
          path: test_results
      - store_test_results:
          path: test_results

  e2e:
    executor: playwright
    steps:
      - attach_workspace:
          at: ~/
      - run:
          name: Expose already installed task binary
          command: echo 'export PATH="/root/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install pnpm package manager
          command: |
            { curl -fsSL https://get.pnpm.io/ -o /tmp/pnpm-install.sh \
              || curl -fsSL https://github.com/pnpm/get.pnpm.io/releases/latest/download/install.sh -o /tmp/pnpm-install.sh; } \
              && sh /tmp/pnpm-install.sh
            echo 'export PNPM_HOME="/root/.local/share/pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Configure pnpm store
          command: pnpm config set store-dir .pnpm-store
      - run:
          name: Setup playwright
          command: task tests:e2e:install
      - run:
          name: Run the end-to-end tests
          command: |
            task run:prod&
            task tests:e2e -- --reporter=junit
          environment:
            PLAYWRIGHT_JUNIT_OUTPUT_NAME: ./test_results/e2e.xml
      - store_artifacts:
          path: test_results
      - store_test_results:
          path: test_results

workflows:
  pull_request:
    when: pipeline.git.branch != "main"
    jobs:
      - setup
      - static-analysis:
          requires:
            - setup
      - tests:
          requires:
            - setup
      - e2e:
          requires:
            - setup
