version: "3"

tasks:
  static:format:
    aliases:
      - f
      - s:f
    cmds:
      - pnpm run format --check
    desc: Check the code style

  static:format:fix:
    aliases:
      - f:f
      - s:f:f
    cmds:
      - pnpm run format --write
    desc: Fix the code style

  static:lint:
    aliases:
      - l
      - s:l
    cmds:
      - pnpm run lint {{.CLI_ARGS}}
    desc: Lint the application code

  static:lint:fix:
    aliases:
      - l:f
      - s:l:f
    cmds:
      - pnpm run lint --fix
    desc: Fix the application code

  static:types:
    aliases:
      - t
      - s:t
    cmds:
      - pnpm run typecheck
    desc: Check the code typing

  unit:
    aliases:
      - u
    cmds:
      - pnpm run test --run {{.CLI_ARGS}}
    desc: Run unit tests

  unit:watch:
    aliases:
      - u:w
    cmds:
      - pnpm run test --watch
    desc: Run unit tests in watch mode

  e2e:
    aliases:
      - e
    cmds:
      - pnpm exec playwright test {{.CLI_ARGS}}
    desc: Runs the end-to-end tests. Be sure to run the application first, preferably in production-like mode.

  e2e:install:
    aliases:
      - e:i
    cmds:
      - pnpm exec playwright install
    desc: Installs the required browsers for end-to-end tests.

  e2e:ui:
    aliases:
      - e:ui
    cmds:
      - pnpm exec playwright test --ui
    desc: Starts the interactive UI mode.

  all:
    aliases:
      - a
    cmds:
      - echo ""
      - echo "|---------------------------|"
      - echo "| Check the code formatting |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:format
      - echo ""
      - echo "|---------------------------|"
      - echo "| Lint the application code |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:lint
      - echo ""
      - echo "|---------------------------|"
      - echo "|   Check the code typing   |"
      - echo "|---------------------------|"
      - echo ""
      - task: static:types
      - echo ""
      - echo "|---------------------------|"
      - echo "|      Run unit tests       |"
      - echo "|---------------------------|"
      - echo ""
      - task: unit
      - echo ""
      - echo "|---------------------------|"
      - echo "|   Run end-to-end tests    |"
      - echo "|---------------------------|"
      - echo ""
      - task: e2e
      - echo ""
      - echo "|---------------------------|"
      - echo "|   All tests successful    |"
      - echo "|---------------------------|"
      - echo ""
    desc: Execute all the tests
