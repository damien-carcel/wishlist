version: 3

tasks:
  dev:
    aliases:
      - d
    cmds:
      - docker compose pull
      - docker compose build --pull
    desc: Build the development image

  prod:
    aliases:
      - p
    cmds:
      - docker build {{.CLI_ARGS}} --platform linux/amd64,linux/arm64 --tag carcel/wishlist:{{.PRODUCTION_IMAGE_TAG}} --target frankenphp_prod .
    desc: Build the production image. Use "PRODUCTION_IMAGE_TAG" variable to specify a tag, "latest" used otherwise. Run with "--push" as a CLI argument to push the built images to the Docker hub.
    vars:
      PRODUCTION_IMAGE_TAG: '{{.PRODUCTION_IMAGE_TAG| default "latest"}}'
