# Development environment override
include:
  - compose.common.yaml

services:
  php:
    build:
      context: .
      target: frankenphp_dev
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      FRANKENPHP_WORKER_CONFIG: watch
      FRANKENPHP_SITE_CONFIG: hot_reload
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-develop}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    volumes:
      - type: bind
        source: .
        target: /app
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/docker/Caddyfile
        read_only: true
      - type: bind
        source: ./docker/conf.d/20-app.dev.ini
        target: /usr/local/etc/php/app.conf.d/20-app.dev.ini
        read_only: true
###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

  database:
    ports:
      - ${WISHLIST_DATABASE_PORT:-5432}:5432
